name: vku_expense_ocr
description: OCR Expense Tracker & Receipt Parser
publish_to: 'none'
http: ^1.2.0 
version: 1.0.0+2
environment:
  sdk: ^3.3.0
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3          # SQLite cục bộ (chạy offline)
  path: ^1.9.0
  path_provider: ^2.1.3    # thư mục lưu ảnh hóa đơn
  image_picker: ^1.1.2     # chụp ảnh bằng camera
  google_mlkit_text_recognition: ^0.13.0  # OCR on-device (kiểm tra bản mới trên pub.dev)
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
